{% load static %}<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Головна{% endblock %} — Реєстрація на події</title>
  <link rel="stylesheet" href="{% static 'events/style.css' %}">
</head>
<body>
  <header class="site-header">
    <nav class="container nav">
      <a class="brand" href="{% url 'events:home' %}">Події</a>
      <a href="{% url 'events:home' %}">Головна</a>
      <a href="{% url 'events:list' %}">Усі заходи</a>
      <a href="{% url 'events:register' %}">Реєстрація</a>
    </nav>
  </header>

  <main class="container">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">© {% now "Y" %} Реєстрація на події · Django</div>
  </footer>
</body>
</html>
